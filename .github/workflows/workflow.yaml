name: workflow
on:
  push:
    branches:
    - Bachelor-Exam
jobs:
  Build-With-Maven-1:
    name: Build-With-Maven-1
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: "11"
    - name: Build with Maven
      run: mvn clean install
  Testing-With-DotNet-2:
    name: Testing-With-DotNet-2
    runs-on: windows-latest
    needs: Build-With-Maven-1
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Set up DotNet
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Run tests
      run: dotnet test
  Linting-Job-3:
    name: Linting-Job-3
    runs-on: windows-latest
    needs: Build-With-Maven-1
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Set up DotNet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Run linter
      run: dotnet build --no-restore --configuration Release /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=false
